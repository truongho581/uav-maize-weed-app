name: GreenEye desktop CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/greeneye-desktop-ci.yml"
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "models/model_inventory.json"
      - "pyproject.toml"
      - "uav_analysis.spec"
  push:
    branches: [main]

jobs:
  test-build-smoke:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: MyPy
        run: mypy
      - name: Test
        run: pytest -q -m "not external_golden"
      - name: Golden planner audit
        run: python tools/phase9_5_integration_audit.py --output phase9_5_audit
      - name: Build frozen application
        run: python -m PyInstaller -y uav_analysis.spec
      - name: Frozen smoke
        run: python tools/smoke_frozen_app.py --seconds 60
      - uses: actions/upload-artifact@v4
        with:
          name: GreenEye-${{ matrix.os }}
          path: |
            dist/UAV_CropAnalysis
            phase9_5_audit
          compression-level: 0
          retention-days: 3
